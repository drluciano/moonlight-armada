---
name: Build - ArmadaOS Flatpak (aarch64)
permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: armada-flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.drluciano.MoonlightArmada
  MANIFEST: packaging/flatpak/io.github.drluciano.MoonlightArmada.json

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils
          # Ubuntu blocks the unprivileged user namespaces that the build sandbox uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}-${{ github.sha }}
          restore-keys: |
            flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}-

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "VERSION=$(cat app/version.txt)-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --repo=repo --force-clean --ccache build-dir $MANIFEST

      - name: Show build environment on failure
        if: failure()
        run: |
          find build-dir/files -name '*.pc' -o -name 'libSDL*' || true
          flatpak build build-dir pkg-config --exists --print-errors SDL2_ttf || true
          flatpak build build-dir pkg-config --modversion sdl2 sdl3 || true

      - name: Bundle
        run: |
          mkdir -p out
          flatpak build-bundle repo out/Moonlight-Armada-${{ env.VERSION }}-aarch64.flatpak $APP_ID \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Smoke test
        run: |
          flatpak install --user -y --noninteractive out/*.flatpak
          QT_QPA_PLATFORM=offscreen timeout 30 flatpak run $APP_ID --version

      - name: Upload Flatpak
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Armada-${{ env.VERSION }}-aarch64-flatpak
          path: out/Moonlight-Armada-${{ env.VERSION }}-aarch64.flatpak
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Flatpak
        uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The AppImage workflow creates the release; wait for it, then add the bundle
          for i in $(seq 1 60); do
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" out/*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
