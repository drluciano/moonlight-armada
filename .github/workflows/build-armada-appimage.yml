---
name: Build - ArmadaOS AppImage (aarch64)
permissions:
  contents: read

on:
  # Pushes to PR branches are built by the pull_request trigger, so only
  # build pushes to main and release tags here to avoid duplicate runs.
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: armada-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            qt6-base-dev qt6-declarative-dev qt6-svg-dev qt6-wayland qt6-qpa-plugins qt6-image-formats-plugins \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtquick-dialogs qml6-module-qtqml-workerscript \
            libsdl2-dev libsdl2-ttf-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libva-dev libvdpau-dev libopus-dev libssl-dev libdrm-dev libegl-dev libgbm-dev libwayland-dev libx11-dev

      - name: Install appimagetool
        run: |
          mkdir -p $RUNNER_TEMP/bin
          wget -q -O $RUNNER_TEMP/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x $RUNNER_TEMP/bin/appimagetool

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "VERSION=$(cat app/version.txt)-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Build
        run: |
          mkdir build
          cd build
          qmake6 ../moonlight-qt.pro CONFIG+=release
          make -j$(nproc)

      - name: Package AppImage
        env:
          # FUSE isn't available on the runner
          APPIMAGETOOL: ${{ runner.temp }}/bin/appimagetool --appimage-extract-and-run
        run: scripts/build-appimage-armada.sh build out/Moonlight-Armada-${{ env.VERSION }}-aarch64.AppImage

      - name: Smoke test
        run: |
          cd out
          ./Moonlight-Armada-${{ env.VERSION }}-aarch64.AppImage --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen timeout 20 squashfs-root/AppRun --version || [ $? -eq 124 ]
          if grep -q "error while loading shared libraries" ~/.cache/moonlight-armada/last-run.log; then
            cat ~/.cache/moonlight-armada/last-run.log
            exit 1
          fi
          rm -rf squashfs-root

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: Moonlight-Armada-${{ env.VERSION }}-aarch64
          path: out/Moonlight-Armada-${{ env.VERSION }}-aarch64.AppImage
          compression-level: 0
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AppImage
        uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v6.2.0-test1 are published as pre-releases
          PRERELEASE=""
          [[ "$GITHUB_REF_NAME" == *-* ]] && PRERELEASE="--prerelease"
          gh release create "$GITHUB_REF_NAME" out/*.AppImage $PRERELEASE \
            --repo "$GITHUB_REPOSITORY" --title "Moonlight Armada $GITHUB_REF_NAME" --generate-notes
